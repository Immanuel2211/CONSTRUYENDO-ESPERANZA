<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CONSTRUYENDO ESPERANZA</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #F5F5DC;
            color: #722F37;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            width: 100%;
            height: 110px;
            padding: 15px 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #F5F5DC;
            border-bottom: 3px solid #722F37;
        }

        /* LOGO */

        .logo {
            width: 80px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #722F37;
            border-radius: 10px;

            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* NOMBRE */

        .nombre-fundacion {
            font-size: 32px;
            font-weight: bold;
            color: #722F37;
            text-align: right;
        }


        /* =========================
           CONTENIDO
        ========================= */

        main {
            width: 100%;
            min-height: calc(100vh - 110px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 5%;
        }


        .proyectos {
            width: 100%;
            max-width: 1200px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }


        /* =========================
           TITULOS
        ========================= */

        .proyecto h2 {
            text-align: center;
            color: #722F37;

            font-size: 26px;

            margin-bottom: 18px;
        }


        /* =========================
           CARRUSEL
        ========================= */

        .carrusel {
            position: relative;

            width: 100%;
            height: 430px;

            background: white;

            border: 4px solid #722F37;
            border-radius: 15px;

            overflow: hidden;

            box-shadow: 0 8px 20px rgba(114, 47, 55, 0.20);
        }


        .slide {
            display: none;

            width: 100%;
            height: 100%;
        }


        .slide.active {
            display: block;
        }


        .slide img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================
           BOTONES
        ========================= */

        .prev,
        .next {

            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(114, 47, 55, 0.85);

            color: #F5F5DC;

            font-size: 25px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.3s;
        }


        .prev {
            left: 15px;
        }


        .next {
            right: 15px;
        }


        .prev:hover,
        .next:hover {

            background: #722F37;

            transform: translateY(-50%) scale(1.1);
        }


        /* =========================
           INDICADORES
        ========================= */

        .dots {

            position: absolute;

            bottom: 15px;

            left: 0;
            right: 0;

            display: flex;

            justify-content: center;

            gap: 8px;
        }


        .dot {

            width: 11px;
            height: 11px;

            border-radius: 50%;

            background: #F5F5DC;

            border: 2px solid #722F37;

            cursor: pointer;
        }


        .dot.active {
            background: #722F37;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 800px) {

            header {
                height: auto;

                padding: 15px 20px;

                gap: 15px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }

            .nombre-fundacion {
                font-size: 20px;
            }


            main {
                padding: 35px 20px;
            }


            .proyectos {

                grid-template-columns: 1fr;

                gap: 45px;
            }


            .carrusel {
                height: 350px;
            }


            .proyecto h2 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header>


        <!-- LOGO -->

        <div class="logo">

            <!--
            AQUÍ COLOCAREMOS EL LOGO
            -->

            <img
                src="logo.png"
                alt="Logo Construyendo Esperanza"
            >

        </div>


        <!-- NOMBRE -->

        <div class="nombre-fundacion">

            CONSTRUYENDO ESPERANZA

        </div>


    </header>



    <!-- =========================
         PROYECTOS
    ========================== -->

    <main>

        <div class="proyectos">


            <!-- =========================
                 PROYECTO ACTUAL
            ========================== -->

            <div class="proyecto">

                <h2>
                    PROYECTO ACTUAL
                </h2>


                <div class="carrusel" id="carruselActual">


                    <div class="slide active">

                        <img
                            src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=1200&q=80"
                            alt="Proyecto actual"
                        >

                    </div>


                    <div class="slide">

                        <img
                            src="https://images.unsplash.com/photo-1494386346843-e12284507169?auto=format&fit=crop&w=1200&q=80"
                            alt="Proyecto actual"
                        >

                    </div>


                    <div class="slide">

                        <img
                            src="https://images.unsplash.com/photo-1509099836639-18ba1795216d?auto=format&fit=crop&w=1200&q=80"
                            alt="Proyecto actual"
                        >

                    </div>


                    <button class="prev" onclick="cambiarSlide(-1, 0)">
                        ‹
                    </button>

                    <button class="next" onclick="cambiarSlide(1, 0)">
                        ›
                    </button>


                    <div class="dots" id="dots0"></div>

                </div>

            </div>



            <!-- =========================
                 PROYECTOS FINALIZADOS
            ========================== -->

            <div class="proyecto">

                <h2>
                    PROYECTOS FINALIZADOS
                </h2>


                <div class="carrusel" id="carruselFinalizados">


                    <div class="slide active">

                        <img
                            src="https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?auto=format&fit=crop&w=1200&q=80"
                            alt="Proyecto finalizado"
                        >

                    </div>


                    <div class="slide">

                        <img
                            src="https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1200&q=80"
                            alt="Proyecto finalizado"
                        >

                    </div>


                    <div class="slide">

                        <img
                            src="https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?auto=format&fit=crop&w=1200&q=80"
                            alt="Proyecto finalizado"
                        >

                    </div>


                    <button class="prev" onclick="cambiarSlide(-1, 1)">
                        ‹
                    </button>

                    <button class="next" onclick="cambiarSlide(1, 1)">
                        ›
                    </button>


                    <div class="dots" id="dots1"></div>

                </div>

            </div>


        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let indices = [0, 0];


        const carruseles = [

            document.querySelector("#carruselActual"),

            document.querySelector("#carruselFinalizados")

        ];


        function mostrarSlide(carruselIndex) {

            const carrusel = carruseles[carruselIndex];

            const slides = carrusel.querySelectorAll(".slide");

            const dots = carrusel.querySelectorAll(".dot");


            slides.forEach(slide => {

                slide.classList.remove("active");

            });


            dots.forEach(dot => {

                dot.classList.remove("active");

            });


            slides[indices[carruselIndex]].classList.add("active");

            dots[indices[carruselIndex]].classList.add("active");

        }


        function cambiarSlide(direccion, carruselIndex) {

            const carrusel = carruseles[carruselIndex];

            const slides = carrusel.querySelectorAll(".slide");


            indices[carruselIndex] += direccion;


            if (indices[carruselIndex] >= slides.length) {

                indices[carruselIndex] = 0;

            }


            if (indices[carruselIndex] < 0) {

                indices[carruselIndex] = slides.length - 1;

            }


            mostrarSlide(carruselIndex);

        }


        function crearDots(carruselIndex) {

            const carrusel = carruseles[carruselIndex];

            const slides = carrusel.querySelectorAll(".slide");

            const contenedor = carrusel.querySelector(".dots");


            slides.forEach((slide, index) => {

                const dot = document.createElement("div");

                dot.classList.add("dot");


                if (index === 0) {

                    dot.classList.add("active");

                }


                dot.addEventListener("click", () => {

                    indices[carruselIndex] = index;

                    mostrarSlide(carruselIndex);

                });


                contenedor.appendChild(dot);

            });

        }


        crearDots(0);

        crearDots(1);


    </script>


</body>
</html>
